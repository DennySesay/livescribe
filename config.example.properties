# ==============================================================================
# LiveScribe Configuration Template
# ==============================================================================
# Copy this file to 'config.properties' in the project root and edit as needed.
# This file contains Twitch credentials and sensitive settings. 'config.properties'
# is listed in '.gitignore' to prevent credentials from being accidentally committed.

# ------------------------------------------------------------------------------
# 1. Channels to Monitor
# ------------------------------------------------------------------------------
# A comma-separated list of channels to monitor. 
# Format: provider:channelName
# Currently supported providers: twitch
# (Note: Kick and YouTube support are planned)
streamers=twitch:theprimeagen, twitch:dougdoug, twitch:ludwig

# ------------------------------------------------------------------------------
# 2. General Settings
# ------------------------------------------------------------------------------
# Polling interval in seconds to check if monitored channels are live.
# Default: 30
check.interval.seconds=30

# Maximum number of concurrent stream downloads/recordings.
# Default: Number of monitored channels in the 'streamers' list
downloads.max.concurrent=5

# Whether to delete the raw Transport Stream (.ts) file after it has been 
# successfully converted to an MP4 (.mp4) file via FFmpeg.
# Default: true (set to false to keep both the raw .ts and the converted .mp4)
scribe.delete-ts=true

# ------------------------------------------------------------------------------
# 3. Output Paths
# ------------------------------------------------------------------------------
# The default base directory where all stream recordings will be saved.
# Default: ~/livescribe
scribe.output.path=~/livescribe

# Provider-specific output directories (optional).
# If specified, recordings for these providers will go to their respective folders.
# If omitted, they will fall back to 'scribe.output.path'.
scribe.output.path.twitch=~/livescribe/twitch
scribe.output.path.kick=~/livescribe/kick
scribe.output.path.youtube=~/livescribe/youtube

# ------------------------------------------------------------------------------
# 4. Twitch API Credentials
# ------------------------------------------------------------------------------
# Credentials for the Twitch Developer Portal (https://dev.twitch.tv/console).
#
# NOTE: If these values are left empty or omitted, LiveScribe will fall back 
# to looking for the following environment variables:
#   - LIVESCRIBE_TWITCH_ID
#   - LIVESCRIBE_TWITCH_SECRET
#
twitch.clientId=your_twitch_client_id_here
twitch.clientSecret=your_twitch_client_secret_here
